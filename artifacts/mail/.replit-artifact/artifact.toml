kind = "web"
previewPath = "/"
title = "FLUENT"
description = "AI-first email. Google sign-in and Gmail connect are separate. Demo data is labeled synthetic. Replies stay local drafts."
version = "1.0.0"
id = "artifacts/mail"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20126

[services.development]
run = "pnpm --filter @workspace/mail run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mail", "run", "build" ]
serve = "static"
publicDir = "artifacts/mail/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20126"
BASE_PATH = "/"
